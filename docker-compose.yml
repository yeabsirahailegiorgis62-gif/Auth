version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: collabwrite-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: auth_system
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: collabwrite-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres123@postgres:5432/auth_system?schema=public"
      JWT_SECRET: "collabwrite_super_secret_jwt_key_2026"
      JWT_REFRESH_SECRET: "collabwrite_super_secret_refresh_jwt_key_2026"
    depends_on:
      - postgres

volumes:
  pgdata:
